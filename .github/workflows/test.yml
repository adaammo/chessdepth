name: Test NodeJS API for ChessDepth

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      API_KEY: test_key

    steps:
      - name: Download repository
        uses: actions/checkout@v6

      - name: Set up Node enviornment
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test